spring.application.name=university-admissions-backend

# Server port - default is 8080, change if that port is busy on your machine
server.port=8080

# Phase 2: Local MongoDB connection
# Assumes MongoDB is running on your machine on the default port (27017)
# with no username/password. If you set up auth, use the commented URI format below instead.
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=university_admissions

# If your local MongoDB requires a username/password, comment out the 3 lines above
# and use this instead:
# spring.data.mongodb.uri=mongodb://USERNAME:PASSWORD@localhost:27017/university_admissions

# Phase 5: Gemini AI settings
# Replace with YOUR real Gemini API key from Google AI Studio.
# Never commit your real key to GitHub - keep this file out of public repos,
# or better, load it from an environment variable in production.
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models

# Phase 4: JWT settings
# jwt.secret MUST be at least 32 characters (256 bits) for HS256.
# This is a development-only value - replace it with your own random string
# before deploying anywhere real, and never commit a production secret to git.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Anyone registering with role=ADMIN must also send this exact string
# as "adminSecret" in the request body, or registration is rejected.
# Change this to your own value.
admin.registration.secret=${ADMIN_REGISTRATION_SECRET}
